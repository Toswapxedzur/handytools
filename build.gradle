import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

repositories {
    mavenCentral()
    maven {
        name = 'RedlanceMinecraft'
        url = uri('https://repo.redlance.org/public')
    }
    maven {
        name = 'Modrinth'
        url = uri('https://api.modrinth.com/maven')
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            jvmArgument '-Xdock:name=Handy Tools Dev Client'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Development fixtures for validating the optional first-person path.
    // runtimeOnly keeps both mods out of Handy Tools' published JAR.
    runtimeOnly(
            "maven.modrinth:first-person-model:${first_person_dev_version}"
    )
    runtimeOnly(
            "maven.modrinth:not-enough-animations:${not_enough_animations_dev_version}"
    )

    jarJar(implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") {
        transitive = false
    }) {
        version {
            strictly pal_version_range
            prefer pal_version
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            pal_version_range      : pal_version_range,
            first_person_version_range: first_person_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources') {
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
}

def hammerIds = [
        'wooden_hammer',
        'cobblestone_hammer',
        'iron_hammer',
        'gold_hammer',
        'diamond_hammer',
        'netherite_hammer'
]

def archived3dVariantIds = [
        'wooden_hammer',
        'cobblestone_hammer',
        'cobbled_deepslate_hammer',
        'blackstone_hammer',
        'copper_hammer',
        'iron_hammer',
        'gold_hammer',
        'diamond_hammer',
        'netherite_hammer'
]

tasks.register('validateHammerAssets') {
    group = 'verification'
    description = 'Validates active flat hammer assets and the legacy 3D archive.'
    notCompatibleWithConfigurationCache('Reads and parses the project asset tree directly.')
    inputs.dir 'src/main/resources/assets/handytools'
    inputs.dir 'archive/legacy-3d-hammer'

    doLast {
        def assets = file('src/main/resources/assets/handytools')
        def archivedAssets = file(
                'archive/legacy-3d-hammer/src/main/resources/assets/handytools'
        )
        def parser = new JsonSlurper()

        hammerIds.each { id ->
            def activeModelFile = new File(assets, "models/item/${id}.json")
            def activeTextureFile = new File(
                    assets,
                    "textures/item/hammer_items/${id}.png"
            )
            def archivedModelFile = new File(
                    archivedAssets,
                    "models/item/${id}.json"
            )
            def archivedTextureFile = new File(
                    archivedAssets,
                    "textures/item/hammers/${id}.png"
            )

            [activeModelFile, activeTextureFile,
                    archivedModelFile, archivedTextureFile].each { required ->
                if (!required.isFile()) {
                    throw new GradleException("Missing hammer asset: ${required}")
                }
            }

            def activeModel = parser.parse(activeModelFile)
            def archivedModel = parser.parse(archivedModelFile)
            def archivedTextures = archivedModel.textures?.values() ?: []

            if (activeModel.parent != 'minecraft:item/handheld_mace') {
                throw new GradleException("${id} item model must inherit handheld_mace")
            }
            if (activeModel.textures?.layer0 != "handytools:item/hammer_items/${id}") {
                throw new GradleException("${id} item model points to the wrong texture")
            }
            if (archivedTextures.any {
                !it.startsWith('handytools:item/hammers/')
            }) {
                throw new GradleException(
                        "${id} archived 3D model has an invalid texture namespace"
                )
            }
            if (!archivedModel.elements) {
                throw new GradleException(
                        "${id} archived 3D model has no geometry"
                )
            }
        }

        if (new File(assets, 'textures/item/hammers').exists()
                || new File(assets, 'models/item/wooden_hammer_inventory.json').exists()) {
            throw new GradleException(
                    'Legacy 3D/context-switching assets must remain outside active resources'
            )
        }

        def commonSource = file('archive/legacy-3d-hammer/common-source')
        [
                'gold_hammer.png',
                'golden_hammer.json',
                'golden_hammer_16x16.png',
                'hammer_variants/generate_variants.mjs',
                'hammer_variants/palettes.json',
                'hammer_variants/palettes.png'
        ].each { path ->
            if (!new File(commonSource, path).isFile()) {
                throw new GradleException("Missing archived 3D source: ${path}")
            }
        }
        archived3dVariantIds.each { id ->
            [
                    "hammer_variants/assets/common/models/item/hammers/${id}.json",
                    "hammer_variants/assets/common/textures/item/hammers/${id}.png"
            ].each { path ->
                if (!new File(commonSource, path).isFile()) {
                    throw new GradleException("Missing archived 3D variant: ${path}")
                }
            }
        }
    }
}

tasks.register('validateEmbeddedPal') {
    group = 'verification'
    description = 'Validates the embedded Player Animation Library mod and license.'
    dependsOn tasks.named('jar')
    inputs.file tasks.named('jar').flatMap { it.archiveFile }
    inputs.property 'palVersion', pal_version

    doLast {
        def modJar = tasks.named('jar').get().archiveFile.get().asFile
        def nestedPath = "META-INF/jarjar/PlayerAnimationLibNeo-${pal_version}.jar"

        new java.util.zip.ZipFile(modJar).withCloseable { outerZip ->
            def nestedEntry = outerZip.getEntry(nestedPath)
            if (nestedEntry == null) {
                throw new GradleException("Missing embedded PAL JAR: ${nestedPath}")
            }

            def outerMetadata = outerZip.getEntry('META-INF/neoforge.mods.toml')
            def outerMetadataText = outerZip.getInputStream(outerMetadata).getText('UTF-8')
            if (!outerMetadataText.contains('modId = "player_animation_library"') ||
                    !outerMetadataText.contains("versionRange = \"${pal_version_range}\"")) {
                throw new GradleException('Handy Tools metadata does not require embedded PAL')
            }
            if (!outerMetadataText.contains('modId = "firstperson"') ||
                    !outerMetadataText.contains('type = "optional"') ||
                    !outerMetadataText.contains("versionRange = \"${first_person_version_range}\"")) {
                throw new GradleException('Handy Tools metadata does not declare optional FirstPerson compatibility')
            }

            def nestedFiles = [] as Set
            new java.util.zip.ZipInputStream(outerZip.getInputStream(nestedEntry)).withCloseable { nestedZip ->
                java.util.zip.ZipEntry entry
                while ((entry = nestedZip.nextEntry) != null) {
                    nestedFiles.add(entry.name)
                }
            }

            ['LICENSE', 'META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json'].each { required ->
                if (!nestedFiles.contains(required)) {
                    throw new GradleException("Embedded PAL JAR is missing ${required}")
                }
            }
        }
    }
}

tasks.register('validateHammerAnimation') {
    group = 'verification'
    description = 'Validates PAL phase lengths, bones, and continuous endpoints.'
    notCompatibleWithConfigurationCache('Reads and parses the animation resource directly.')
    inputs.file 'src/main/resources/assets/handytools/player_animations/hammer.animation.json'

    doLast {
        def animationFile = file(
                'src/main/resources/assets/handytools/player_animations/hammer.animation.json'
        )
        def animations = new JsonSlurper().parse(animationFile).animations
        def phases = [
                hammer_preparation: 0.5,
                hammer_raise      : 0.7,
                hammer_descend    : 0.4,
                hammer_release    : 0.5
        ]
        def bones = [
                'body', 'torso', 'head', 'right_arm', 'left_arm',
                'right_leg', 'left_leg', 'right_item'
        ]

        phases.each { name, length ->
            def animation = animations[name]
            if (animation == null) {
                throw new GradleException("Missing PAL animation: ${name}")
            }
            if (animation.animation_length != length) {
                throw new GradleException(
                        "${name} must last ${length} seconds"
                )
            }
            bones.each { bone ->
                if (animation.bones[bone] == null) {
                    throw new GradleException(
                            "${name} is missing full-body bone ${bone}"
                    )
                }
            }
        }

        ['hammer_preparation', 'hammer_raise', 'hammer_release'].each { name ->
            animations[name].bones.each { bone, transforms ->
                transforms.each { transform, frames ->
                    def lastTime = frames.keySet().max { it as BigDecimal }
                    if (frames[lastTime].easing != 'easeinoutcubic') {
                        throw new GradleException(
                                "${name} ${bone}.${transform} must ease to rest"
                        )
                    }
                }
            }
        }

        animations.hammer_descend.bones.each { bone, transforms ->
            transforms.each { transform, frames ->
                def start = frames['0.0']
                def bridge = frames['0.35']
                def impact = frames['0.4']
                if (start == null || bridge?.easing != 'easeincubic'
                        || impact?.easing != 'easeoutcubic') {
                    throw new GradleException(
                            "hammer_descend ${bone}.${transform} must use its " +
                                    'matched cubic impact bridge'
                    )
                }
                (0..2).each { axis ->
                    def expected = start.vector[axis] + 0.875 *
                            (impact.vector[axis] - start.vector[axis])
                    if (Math.abs(bridge.vector[axis] - expected) > 0.000001) {
                        throw new GradleException(
                                "hammer_descend ${bone}.${transform} breaks " +
                                        'velocity continuity before impact'
                        )
                    }
                }
            }
        }

        def firstVector = { animation, bone, transform ->
            def frames = animation.bones[bone][transform]
            def time = frames.keySet().min { it as BigDecimal }
            frames[time].vector
        }
        def lastVector = { animation, bone, transform ->
            def frames = animation.bones[bone][transform]
            def time = frames.keySet().max { it as BigDecimal }
            frames[time].vector
        }
        def joins = [
                ['hammer_preparation', 'hammer_raise'],
                ['hammer_raise', 'hammer_descend'],
                ['hammer_descend', 'hammer_release'],
                ['hammer_release', 'hammer_preparation']
        ]

        joins.each { join ->
            def before = animations[join[0]]
            def after = animations[join[1]]
            bones.each { bone ->
                before.bones[bone].keySet().each { transform ->
                    if (after.bones[bone][transform] != null
                            && lastVector(before, bone, transform)
                            != firstVector(after, bone, transform)) {
                        throw new GradleException(
                                "PAL pose discontinuity at ${join[0]} -> " +
                                        "${join[1]} for ${bone}.${transform}"
                        )
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateHammerAssets')
    dependsOn tasks.named('validateEmbeddedPal')
    dependsOn tasks.named('validateHammerAnimation')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
