import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

repositories {
    mavenCentral()
    maven {
        name = 'RedlanceMinecraft'
        url = uri('https://repo.redlance.org/public')
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            jvmArgument '-Xdock:name=Handy Tools Dev Client'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    jarJar(implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") {
        transitive = false
    }) {
        version {
            strictly pal_version_range
            prefer pal_version
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            pal_version_range      : pal_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources') {
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
}

def hammerIds = [
        'wooden_hammer',
        'cobblestone_hammer',
        'iron_hammer',
        'gold_hammer',
        'diamond_hammer',
        'netherite_hammer'
]

tasks.register('validateHammerAssets') {
    group = 'verification'
    description = 'Validates the paired flat and full-scale third-person hammer assets.'
    notCompatibleWithConfigurationCache('Reads and parses the project asset tree directly.')
    inputs.dir 'src/main/resources/assets/handytools'

    doLast {
        def assets = file('src/main/resources/assets/handytools')
        def parser = new JsonSlurper()

        hammerIds.each { id ->
            def worldModelFile = new File(assets, "models/item/${id}.json")
            def guiModelFile = new File(assets, "models/item/${id}_inventory.json")
            def worldTextureFile = new File(assets, "textures/item/hammers/${id}.png")
            def guiTextureFile = new File(assets, "textures/item/hammer_items/${id}.png")

            [worldModelFile, guiModelFile, worldTextureFile, guiTextureFile].each { required ->
                if (!required.isFile()) {
                    throw new GradleException("Missing hammer asset: ${required}")
                }
            }

            def worldModel = parser.parse(worldModelFile)
            def guiModel = parser.parse(guiModelFile)
            def worldTextures = worldModel.textures?.values() ?: []

            if (worldTextures.any { !it.startsWith('handytools:item/hammers/') }) {
                throw new GradleException("${id} 3D model has an invalid texture namespace")
            }
            if (guiModel.parent != 'minecraft:item/handheld_mace') {
                throw new GradleException("${id} GUI model must inherit handheld_mace")
            }
            if (guiModel.textures?.layer0 != "handytools:item/hammer_items/${id}") {
                throw new GradleException("${id} GUI model points to the wrong texture")
            }

            def head = worldModel.elements?.find { it.name == 'hammer_head' }
            def lowerHandle = worldModel.elements?.find { it.name == 'handle_lower' }
            if (head?.from != [4, 8, 4] || head?.to != [12, 16, 12]) {
                throw new GradleException(
                        "${id} head geometry no longer matches the press contact calculation"
                )
            }
            if (lowerHandle?.from != [7, -4, 7] || lowerHandle?.to != [9, 2, 9]) {
                throw new GradleException(
                        "${id} handle no longer supports the six-pixel press pivot"
                )
            }

            ['thirdperson_righthand', 'thirdperson_lefthand'].each { context ->
                if (worldModel.display?.get(context)?.scale != [1.0, 1.0, 1.0]) {
                    throw new GradleException(
                            "${id} ${context} must use one model unit per world pixel"
                    )
                }
            }
        }
    }
}

tasks.register('validateEmbeddedPal') {
    group = 'verification'
    description = 'Validates the embedded Player Animation Library mod and license.'
    dependsOn tasks.named('jar')
    inputs.file tasks.named('jar').flatMap { it.archiveFile }
    inputs.property 'palVersion', pal_version

    doLast {
        def modJar = tasks.named('jar').get().archiveFile.get().asFile
        def nestedPath = "META-INF/jarjar/PlayerAnimationLibNeo-${pal_version}.jar"

        new java.util.zip.ZipFile(modJar).withCloseable { outerZip ->
            def nestedEntry = outerZip.getEntry(nestedPath)
            if (nestedEntry == null) {
                throw new GradleException("Missing embedded PAL JAR: ${nestedPath}")
            }

            def outerMetadata = outerZip.getEntry('META-INF/neoforge.mods.toml')
            def outerMetadataText = outerZip.getInputStream(outerMetadata).getText('UTF-8')
            if (!outerMetadataText.contains('modId = "player_animation_library"') ||
                    !outerMetadataText.contains("versionRange = \"${pal_version_range}\"")) {
                throw new GradleException('Handy Tools metadata does not require embedded PAL')
            }

            def nestedFiles = [] as Set
            new java.util.zip.ZipInputStream(outerZip.getInputStream(nestedEntry)).withCloseable { nestedZip ->
                java.util.zip.ZipEntry entry
                while ((entry = nestedZip.nextEntry) != null) {
                    nestedFiles.add(entry.name)
                }
            }

            ['LICENSE', 'META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json'].each { required ->
                if (!nestedFiles.contains(required)) {
                    throw new GradleException("Embedded PAL JAR is missing ${required}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateHammerAssets')
    dependsOn tasks.named('validateEmbeddedPal')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
