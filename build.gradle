import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

repositories {
    mavenCentral()
    maven {
        name = 'RedlanceMinecraft'
        url = uri('https://repo.redlance.org/public')
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            jvmArgument '-Xdock:name=Handy Tools Dev Client'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    jarJar(implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") {
        transitive = false
    }) {
        version {
            strictly pal_version_range
            prefer pal_version
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            pal_version_range      : pal_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources') {
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
}

def hammerIds = [
        'wooden_hammer',
        'cobblestone_hammer',
        'iron_hammer',
        'gold_hammer',
        'diamond_hammer',
        'netherite_hammer'
]

def archived3dVariantIds = [
        'wooden_hammer',
        'cobblestone_hammer',
        'cobbled_deepslate_hammer',
        'blackstone_hammer',
        'copper_hammer',
        'iron_hammer',
        'gold_hammer',
        'diamond_hammer',
        'netherite_hammer'
]

tasks.register('validateHammerAssets') {
    group = 'verification'
    description = 'Validates active flat hammer assets and the legacy 3D archive.'
    notCompatibleWithConfigurationCache('Reads and parses the project asset tree directly.')
    inputs.dir 'src/main/resources/assets/handytools'
    inputs.dir 'archive/legacy-3d-hammer'

    doLast {
        def assets = file('src/main/resources/assets/handytools')
        def archivedAssets = file(
                'archive/legacy-3d-hammer/src/main/resources/assets/handytools'
        )
        def parser = new JsonSlurper()

        hammerIds.each { id ->
            def activeModelFile = new File(assets, "models/item/${id}.json")
            def activeTextureFile = new File(
                    assets,
                    "textures/item/hammer_items/${id}.png"
            )
            def archivedModelFile = new File(
                    archivedAssets,
                    "models/item/${id}.json"
            )
            def archivedTextureFile = new File(
                    archivedAssets,
                    "textures/item/hammers/${id}.png"
            )

            [activeModelFile, activeTextureFile,
                    archivedModelFile, archivedTextureFile].each { required ->
                if (!required.isFile()) {
                    throw new GradleException("Missing hammer asset: ${required}")
                }
            }

            def activeModel = parser.parse(activeModelFile)
            def archivedModel = parser.parse(archivedModelFile)
            def archivedTextures = archivedModel.textures?.values() ?: []

            if (activeModel.parent != 'minecraft:item/handheld_mace') {
                throw new GradleException("${id} item model must inherit handheld_mace")
            }
            if (activeModel.textures?.layer0 != "handytools:item/hammer_items/${id}") {
                throw new GradleException("${id} item model points to the wrong texture")
            }
            if (archivedTextures.any {
                !it.startsWith('handytools:item/hammers/')
            }) {
                throw new GradleException(
                        "${id} archived 3D model has an invalid texture namespace"
                )
            }
            if (!archivedModel.elements) {
                throw new GradleException(
                        "${id} archived 3D model has no geometry"
                )
            }
        }

        if (new File(assets, 'textures/item/hammers').exists()
                || new File(assets, 'models/item/wooden_hammer_inventory.json').exists()) {
            throw new GradleException(
                    'Legacy 3D/context-switching assets must remain outside active resources'
            )
        }

        def commonSource = file('archive/legacy-3d-hammer/common-source')
        [
                'gold_hammer.png',
                'golden_hammer.json',
                'golden_hammer_16x16.png',
                'hammer_variants/generate_variants.mjs',
                'hammer_variants/palettes.json',
                'hammer_variants/palettes.png'
        ].each { path ->
            if (!new File(commonSource, path).isFile()) {
                throw new GradleException("Missing archived 3D source: ${path}")
            }
        }
        archived3dVariantIds.each { id ->
            [
                    "hammer_variants/assets/common/models/item/hammers/${id}.json",
                    "hammer_variants/assets/common/textures/item/hammers/${id}.png"
            ].each { path ->
                if (!new File(commonSource, path).isFile()) {
                    throw new GradleException("Missing archived 3D variant: ${path}")
                }
            }
        }
    }
}

tasks.register('validateEmbeddedPal') {
    group = 'verification'
    description = 'Validates the embedded Player Animation Library mod and license.'
    dependsOn tasks.named('jar')
    inputs.file tasks.named('jar').flatMap { it.archiveFile }
    inputs.property 'palVersion', pal_version

    doLast {
        def modJar = tasks.named('jar').get().archiveFile.get().asFile
        def nestedPath = "META-INF/jarjar/PlayerAnimationLibNeo-${pal_version}.jar"

        new java.util.zip.ZipFile(modJar).withCloseable { outerZip ->
            def nestedEntry = outerZip.getEntry(nestedPath)
            if (nestedEntry == null) {
                throw new GradleException("Missing embedded PAL JAR: ${nestedPath}")
            }

            def outerMetadata = outerZip.getEntry('META-INF/neoforge.mods.toml')
            def outerMetadataText = outerZip.getInputStream(outerMetadata).getText('UTF-8')
            if (!outerMetadataText.contains('modId = "player_animation_library"') ||
                    !outerMetadataText.contains("versionRange = \"${pal_version_range}\"")) {
                throw new GradleException('Handy Tools metadata does not require embedded PAL')
            }

            def nestedFiles = [] as Set
            new java.util.zip.ZipInputStream(outerZip.getInputStream(nestedEntry)).withCloseable { nestedZip ->
                java.util.zip.ZipEntry entry
                while ((entry = nestedZip.nextEntry) != null) {
                    nestedFiles.add(entry.name)
                }
            }

            ['LICENSE', 'META-INF/neoforge.mods.toml', 'META-INF/jarjar/metadata.json'].each { required ->
                if (!nestedFiles.contains(required)) {
                    throw new GradleException("Embedded PAL JAR is missing ${required}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateHammerAssets')
    dependsOn tasks.named('validateEmbeddedPal')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
